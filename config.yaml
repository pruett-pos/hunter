# Hunter configuration. Edit this file to tune what Hunter looks for.

center:
  name: West Plains, MO
  lat: 36.7281
  lon: -91.8524
radius_miles: 100

# Keep deals priced at or below this share of the estimated after-repair value.
max_price_to_arv: 0.50

email:
  to: al@aaqualityroofing.com
  subject_prefix: "Hunter deals"

claude:
  model: claude-opus-5-5
  extract_effort: low      # reading listings out of pages
  arv_effort: medium       # estimating ARV with web search
  max_arv_per_run: 25      # cost cap: new properties valued per run
  max_web_searches_per_arv: 5

# How many days back to search public-notice sites each run.
notice_lookback_days: 7
max_notices_per_site: 60

# Sources. kind=notices drives a newspaper public-notice search site;
# kind=page loads each URL, and Claude reads listings off the rendered page.
sources:
  - id: mo_public_notices
    name: Missouri Public Notices
    kind: notices
    state: MO
    url: https://www.mopublicnotices.com/Search.aspx
    keywords: ["trustee's sale", "sheriff's sale", "foreclosure", "delinquent land tax sale"]
  - id: ar_public_notices
    name: Arkansas Public Notices
    kind: notices
    state: AR
    url: https://www.arkansaspublicnotices.com/Search.aspx
    keywords: ["foreclosure", "commissioner's sale", "trustee's sale"]
  - id: cosl_post_auction
    name: AR Commissioner of State Lands (post-auction)
    kind: page
    deal_type: tax_sale
    urls: ["https://auction.cosl.org/Auctions/ListingsView"]
  - id: hud
    name: HUD Home Store
    kind: page
    deal_type: reo_hud
    urls:
      - https://www.hudhomestore.gov/searchresult?citystate=MO
      - https://www.hudhomestore.gov/searchresult?citystate=AR
  - id: homepath
    name: Fannie Mae HomePath
    kind: page
    deal_type: reo_bank
    urls:
      - https://homepath.fanniemae.com/listing?location=West%20Plains%2C%20MO&radius=100
  - id: usda
    name: USDA Rural Development resales
    kind: page
    deal_type: reo_usda
    urls:
      - https://properties.sc.egov.usda.gov/resales/public/searchSFH?state=MO
      - https://properties.sc.egov.usda.gov/resales/public/searchSFH?state=AR
  - id: vrm
    name: VA REO (VRM)
    kind: page
    deal_type: reo_va
    urls: ["https://listings.vrmco.com/search?state=MO", "https://listings.vrmco.com/search?state=AR"]
  - id: auction_com
    name: Auction.com
    kind: page
    deal_type: auction
    urls: ["https://www.auction.com/residential/mo/", "https://www.auction.com/residential/ar/"]
  - id: xome
    name: Xome
    kind: page
    deal_type: auction
    urls: ["https://www.xome.com/auctions/listing/MO", "https://www.xome.com/auctions/listing/AR"]
  - id: hubzu
    name: Hubzu
    kind: page
    deal_type: auction
    urls: ["https://www.hubzu.com/properties/MO", "https://www.hubzu.com/properties/AR"]
  - id: realtybid
    name: RealtyBid
    kind: page
    deal_type: auction
    urls: ["https://www.realtybid.com/search?state=MO", "https://www.realtybid.com/search?state=AR"]

# Counties within ~100 miles of West Plains (from deal-sources.xlsx).
